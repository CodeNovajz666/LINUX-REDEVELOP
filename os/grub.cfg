# Novix 1.1.5 -- GRUB multiboot menu (staged into the ISO by build.py iso).
# The kernel carries a multiboot1 header with the a.out-kludge flags
# (kernel/boot.S), so GRUB loads the ELF64 image the same way QEMU -kernel
# does. root=/dev/hd0 selects the FAT32 boot disk; when no ATA disk answers,
# the kernel falls back to the ramfs root honestly.
set timeout=10
set default=0

menuentry "Novix 1.1.5 -- run (login world)" {
    multiboot /boot/kernel.elf root=/dev/hd0 interactive
    boot
}

menuentry "Novix 1.1.5 -- kernel self-test (46 gates)" {
    multiboot /boot/kernel.elf root=/dev/hd0
    boot
}

menuentry "Novix 1.1.5 -- kernel debug shell (console=debug)" {
    multiboot /boot/kernel.elf root=/dev/hd0 interactive console=debug
    boot
}
